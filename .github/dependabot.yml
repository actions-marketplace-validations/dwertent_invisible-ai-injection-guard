version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Security updates go to branches named dependabot/<ecosystem>/security-<hash>. The weekly
      # merge workflow only merges those branches.
      security:
        applies-to: security-updates
        patterns: ['*']
      dev-dependencies:
        dependency-type: development
      actions-toolkit:
        patterns: ['@actions/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
